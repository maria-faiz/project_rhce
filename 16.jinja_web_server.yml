Setup a WebServer on webserver group hosts:

Create a Custom Role role name should be mywebserver

Create a playbook and playbook name should be web_server.yml
=================

Task1)

  install httpd and firewalld packages

Task2) 
 
  Start | enable httpd and firewalld


Task3)

  Add firewall Rule for http    


Task4)
  Host the web page using the web.j2

  The web.j2 should contain:
  ------------------------

  My host is HOSTNAME on IPADDRESS

  --------------------------
Note: HOSTNAME should be fully qualified domain name.
=========================================================================================
Hint: 

(if firewalld module missing, you need to install ansible.posix colletion, firewalld module
  bundled in this collection)


# Command to Install Collection

ansible-galaxy collection install ansible.posix
 
